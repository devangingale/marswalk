name: Identity guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages, identities and branch names
        env:
          BLOCKED_SHA256: 3f027b48a2654ee198586100d693b58ac726f56704a1c683c60d6c7dc7a33c6f
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, subprocess, sys
          blocked = set(os.environ["BLOCKED_SHA256"].split(","))
          def hits(text):
              return any(hashlib.sha256(t.encode()).hexdigest() in blocked
                         for t in re.findall(r"[a-z0-9]+", text.lower()))
          if os.environ["EVENT"] == "pull_request":
              rng = [f'{os.environ["PR_BASE"]}..{os.environ["PR_HEAD"]}']
          elif set(os.environ["BEFORE"]) == {"0"}:
              rng = [os.environ["AFTER"], "--not", "--remotes=origin/main"]
          else:
              rng = [f'{os.environ["BEFORE"]}..{os.environ["AFTER"]}']
          log = subprocess.run(["git", "log", "--format=%H%x00%an%x00%ae%x00%cn%x00%ce%x00%B%x1e", *rng],
                               capture_output=True, text=True, check=True).stdout
          bad = [rec.split("\0", 1)[0].strip()[:7] for rec in log.split("\x1e") if rec.strip() and hits(rec)]
          if hits(os.environ["REF_NAME"]):
              print("Blocked name in branch name.")
              sys.exit(1)
          if bad:
              print("Blocked name in commits:", ", ".join(bad))
              sys.exit(1)
          print("No blocked names.")
          PY
