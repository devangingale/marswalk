# Written with AI assistance, directed and reviewed by the team.
# Builds the app and deploys it to Cloudflare Pages on every push to main.
# Setup (repository settings, environment "production"): see docs/deploy.md.
name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      VITE_R2_BASE_URL: ${{ vars.VITE_R2_BASE_URL }}
      VITE_GLOBE_BASE: ${{ vars.VITE_GLOBE_BASE }}
      VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check production configuration
        run: |
          if [ -z "$VITE_R2_BASE_URL" ]; then
            echo "::error::Set the VITE_R2_BASE_URL variable: production loads panoramas.json and site bundles from R2."
            exit 1
          fi
          case "$VITE_R2_BASE_URL" in */) echo "::error::VITE_R2_BASE_URL must not end with a slash"; exit 1;; esac
          if [ -z "$VITE_CESIUM_ION_TOKEN" ]; then
            echo "::warning::VITE_CESIUM_ION_TOKEN is not set: the live app will have no 3D Mars terrain."
          fi
          # The CDN must already serve a valid manifest, or the 360° view would ship broken.
          curl -fsS "$VITE_R2_BASE_URL/panoramas.json" | python3 -c "import json,sys; n=len(json.load(sys.stdin)['stops']); print(f'R2 panoramas.json: {n} stops')"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Drop source maps from the upload
        run: find dist -name '*.map' -delete

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: >
          npx --yes wrangler@4.162.0 pages deploy dist
          --project-name "$PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
