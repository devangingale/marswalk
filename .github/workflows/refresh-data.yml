# Written with AI assistance, directed and reviewed by the team.
# Daily data refresh: fetch the current NASA NAIF SPICE kernels, recompute MRO and Mars Odyssey
# relay passes over Gale and Jezero for the next 30 days, rebuild the 360° panoramas from the
# NASA Photojournal, and sync passes.json, panoramas.json and the 2:1 textures to Cloudflare R2.
# The live app reads them from R2, so no redeploy is needed.
# DEM-derived products (grids, walkability) need the coordinator's datasets: see docs/deploy.md.
name: Refresh orbiter passes and panoramas

# Manual until a Cloudflare API token is stored as a repository secret; then restore the daily
# schedule:  schedule: [{ cron: "17 6 * * *" }]  (06:17 UTC).
on:
  workflow_dispatch:
    inputs:
      days:
        description: Pass window length in days (clamped to kernel coverage)
        default: "30"

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_PUBLIC: ${{ vars.VITE_R2_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check configuration
        run: |
          for name in R2_BUCKET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_PUBLIC; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (see docs/deploy.md)"; exit 1; fi
          done

      - run: pip install -r pipeline/requirements-ci.txt

      # Kernels: restore the last run's copies; fetch_spice.py re-downloads only what NAIF updated.
      - uses: actions/cache@v4
        with:
          path: data/raw/naif_spice
          key: naif-spice-${{ github.run_id }}
          restore-keys: naif-spice-

      # Source mosaics and API/Photojournal responses: restore the last run's cache, so a refresh
      # downloads only newly published panoramas.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: nasa-panos-${{ github.run_id }}
          restore-keys: nasa-panos-

      - name: Fetch NAIF SPICE kernels (MRO, Odyssey)
        run: python pipeline/fetch_spice.py --orbiters MRO,ODY

      - name: Compute relay passes
        env:
          DAYS: ${{ inputs.days || '30' }}
        run: python pipeline/passes.py --orbiters MRO,ODY --days "$DAYS" --no-plot

      # CI has no DEM grids: keep the walkability a coordinator run published for unmoved stops.
      - name: Discover and rebuild panoramas.json and 2:1 textures
        run: python pipeline/build_panoramas.py --previous "$R2_PUBLIC/panoramas.json"

      - name: Sync to Cloudflare R2
        run: python pipeline/upload_r2.py --site all --only passes.json --surface360

      - name: Verify the CDN serves the new data
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["R2_PUBLIC"].rstrip("/")
          def get(path):
              req = urllib.request.Request(f"{base}/{path}", headers={"User-Agent": "marswalk-ci", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          stops = get("panoramas.json")["stops"]
          print(f"panoramas.json: {len(stops)} stops")
          for site in ("gale", "jezero"):
              b = get(f"passes/{site}.json")
              print(f"passes/{site}.json: {len(b['passes'])} passes, window {b['window']['start']} to {b['window']['end']}")
          PY
